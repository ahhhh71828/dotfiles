# Linux 的跨工具快捷鍵，由 kitty.conf 的 include keys-${KITTY_OS}.conf 載入。
# macOS 版在 keys-macos.conf。
#
# 用 ctrl，跟同一台電腦上其他 App 的復原、複製、貼上一致。
# 送出的 control code 和 macOS 相同，fish、bash、nvim 的設定不用改。

# ctrl+z 送出 0x1f（Ctrl+_），接成「復原」。
# 代價：終端機原本的 ctrl+z「暫停程式」不能用了。
map ctrl+z send_text all \x1f

# ctrl+shift+z 送出 0x1e（Ctrl+^），接成「重做」。
# 蓋掉 kitty 預設的「捲到上一個提示列」。
map ctrl+shift+z send_text all \x1e

# ctrl+c：有反白就複製，沒反白就照常停止正在跑的程式。
# 和 macOS 的差別：沒反白時不會複製整行指令。
map ctrl+c copy_or_interrupt

# ctrl+v 貼上，跟其他 App 一致（kitty 在 Linux 預設是 ctrl+shift+v）。
map ctrl+v paste_from_clipboard
