# macOS 的跨工具快捷鍵，由 kitty.conf 的 include keys-${KITTY_OS}.conf 載入。
# Linux 版在 keys-linux.conf。
#
# 做法：kitty 把按鍵翻成沒有程式在用的 control code，shell 和 nvim 各自接住。
# 對接處：~/.config/fish/functions/fish_user_key_bindings.fish
#         ~/.config/blesh/init.sh（bash）
#         ~/.config/nvim/lua/config/keymaps.lua

# cmd+z 送出 0x1f（Ctrl+_），接成「復原」。
map cmd+z send_text all \x1f

# cmd+shift+z 送出 0x1e（Ctrl+^），接成「重做」。
map cmd+shift+z send_text all \x1e

# cmd+c 送出 0x1d（Ctrl+]），交給前景程式自己決定要複製什麼：
# fish、bash 複製你正在打的那行指令，nvim 複製選取範圍（沒選取就複製整行）。
# 這會蓋掉 kitty 原本的「複製反白輸出」，但 copy_on_select 已經處理那件事了。
map cmd+c send_text all \x1d
