add_newline = false
right_format = ""

format = "$directory$git_branch$git_status$conda$character"

[directory]
format = "[$path]($style)"
style = "fg:#D9DEE8 bold"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
fish_style_pwd_dir_length = 0
home_symbol = "~"

[git_branch]
symbol = ""
format = "  [git:$branch]($style)"
style = "fg:#7DB7FF bold"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "fg:#FF6B8A bold"

[conda]
symbol = ""
format = " [•](fg:#8B90A3 bold) [env:$environment]($style)"
style = "fg:#FFD166 bold"
ignore_base = true

[python]
disabled = true

[cmd_duration]
disabled = true

[time]
disabled = true

[character]
success_symbol = " [❯](fg:#F5A6D6 bold) "
error_symbol = " [❯](fg:#FF5C7A bold) "
vimcmd_symbol = " [❮](fg:#7DB7FF bold) "
