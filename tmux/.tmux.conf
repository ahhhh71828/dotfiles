# ===== Basic =====
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 100000

# true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ===== Status bar =====
# 底色與 kitty、nvim 統一為 #161616；彩色部分用 Catppuccin Mocha 的粉彩。
# 高飽和色當語法高亮的細筆畫沒問題，鋪成大面積色塊就會刺眼，所以狀態列走
# 粉彩，nvim 的語法高亮維持 carbonfox，兩邊分工不同不衝突。
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 40
set -g status-style "bg=#161616,fg=#cdd6f4"

# 視窗的循環用色，依 window index 取五為餘數輪替。teal 與 mauve 刻意不在
# 這裡，它們保留給 session 與時間，兩端的固定資訊永遠不會跟任何視窗撞色。
# 要換色只改 @wcol 那一行的五個 hex。當前視窗拿它當實心底色，其餘視窗拿
# 它當文字色 —— 不另外調暗，因為粉彩往黑裡壓會失去色相變濁（蜜桃變土褐、
# 黃變卡其）。實心底色與純文字的權重差距已經夠大。
# hex 一律小寫。tmux 會把 #F、#D 當成它自己的變數展開，#FAB387 會變成
# *AB387、#D20F39 會變成 %020F39；小寫的 #fab387 則原樣通過。
set -g @wi   "#{e|%%:#{e|-:#I,1},5}"
set -g @wcol "#{?#{==:#{E:@wi},0},#89b4fa,#{?#{==:#{E:@wi},1},#fab387,#{?#{==:#{E:@wi},2},#a6e3a1,#{?#{==:#{E:@wi},3},#f5c2e7,#f9e2af}}}}"

# 左端：session 名稱。暗底 teal 膠囊 —— 它的內容永遠不變、位置永遠在最左，
# 是一個地標而不是需要讀的資訊，所以不跟當前視窗搶實心。
set -g status-left "#[fg=#324340,bg=#161616]#[fg=#94e2d5,bg=#324340,bold] #S #[fg=#324340,bg=#161616] "

# 視窗列表：整條列上只有當前視窗是實心色塊，其餘是同色相的暗字。
# 實心色塊會隨著切換視窗而移動，移動本身就是最強的視覺訊號。
set -g window-status-separator ""
setw -g automatic-rename on
setw -g window-status-format "#[fg=#{E:@wcol},bg=#161616] #I:#W "
setw -g window-status-current-format "#[fg=#{E:@wcol},bg=#161616]#[fg=#161616,bg=#{E:@wcol},bold] #I:#W #[fg=#{E:@wcol},bg=#161616]"

# 右端：只留時間。日期拿掉是因為 macOS 選單列本來就有，主機名拿掉是因為
# 在不 ssh 出去的情況下它永遠是同一個值。
set -g status-right "#[fg=#3e3648,bg=#161616]#[fg=#cba6f7,bg=#3e3648] %H:%M #[fg=#3e3648,bg=#161616]"

# panes/messages
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# copy mode vim keys
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
